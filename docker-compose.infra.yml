services:
  postgres:
    image: postgres:15-alpine
    container_name: escape-room-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: escaperoom
    ports:
      - "5432:5432"
    volumes:
      - escape_room_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d escaperoom"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: escape-room-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - escape_room_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  escape_room_pg_data:
  escape_room_redis_data:

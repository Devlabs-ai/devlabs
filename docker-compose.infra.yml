services:
  postgres:
    # pgvector/pgvector:pg15 is postgres:15 + pgvector extension preinstalled.
    image: pgvector/pgvector:pg15
    container_name: devlabs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devlabs
    ports:
      - "5432:5432"
    volumes:
      - devlabs_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devlabs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: devlabs-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - devlabs_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devlabs_pg_data:
  devlabs_redis_data:

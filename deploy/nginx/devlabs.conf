# DevSetu edge proxy — HTTP → HTTPS redirect + TLS termination.
# Certs: /etc/letsencrypt/live/devsetu.io/ (Certbot on the EC2 host).

upstream devlabs_backend {
  server backend:4000;
}

# ACME HTTP-01 + redirect everything else to HTTPS
server {
  listen 80;
  server_name devsetu.io www.devsetu.io _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name devsetu.io www.devsetu.io;

  ssl_certificate     /etc/letsencrypt/live/devsetu.io/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/devsetu.io/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 4m;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://devlabs_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
  }

  location /health {
    proxy_pass http://devlabs_backend;
    proxy_set_header Host $host;
  }

  location /ws/ {
    proxy_pass http://devlabs_backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
  }
}

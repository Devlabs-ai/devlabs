# Elastic Docker-box capacity on top of the labs-docker managed node group (the always-on
# base, env.sh). Same pattern as labs-linux-elastic: Karpenter buys a node only when a box is
# Pending (base full) and removes it once empty. Same label, taint and shape as the base;
# tainted so nothing but Docker boxes and their NRI plugin lands here.
#
# A Docker box is a Linux box (user-namespaced, systemd as PID 1) that also runs dockerd and
# the learner's containers: 256Mi / 100m requested, 512Mi / 1 CPU limit, and /var/lib/docker
# on an emptyDir backed by this node's disk. On a t4g.medium (4 GiB), memory requests cap it
# at 12 boxes; maxPods 17 leaves room for the five DaemonSets.
# kube-reserved memory = 11 × maxPods + 255 Mi.
# Keep maxPods / kubeReserved / podPidsLimit / disk in sync with EKS_DOCKER_* in env.sh.
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: labs-docker-elastic
spec:
  role: KarpenterNodeRole-devlabs
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: devlabs
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: devlabs
  kubelet:
    maxPods: 17
    kubeReserved:
      cpu: 70m
      memory: 442Mi
      ephemeral-storage: 1Gi
  userData: |
    MIME-Version: 1.0
    Content-Type: multipart/mixed; boundary="BOUNDARY"

    --BOUNDARY
    Content-Type: application/node.eks.aws

    apiVersion: node.eks.aws/v1alpha1
    kind: NodeConfig
    spec:
      kubelet:
        config:
          podPidsLimit: 1024
    --BOUNDARY
    Content-Type: text/x-shellscript; charset="us-ascii"

    #!/bin/bash
    # Nothing in the labs uses io_uring, and it is a frequent source of kernel privilege
    # escalation bugs reachable from containers. Same as the managed groups (nodegroups.sh).
    printf 'kernel.io_uring_disabled = 2\n' > /etc/sysctl.d/90-devlabs-learner.conf
    sysctl -p /etc/sysctl.d/90-devlabs-learner.conf
    --BOUNDARY--
  # IMDS for the host only: learner pods cannot reach the node role's credentials.
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  tags:
    devlabs.io/pool: docker
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: labs-docker-elastic
spec:
  template:
    metadata:
      labels:
        devlabs.io/pool: docker
        devlabs.io/tier: elastic
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: labs-docker-elastic
      taints:
        - key: devlabs.io/pool
          value: docker
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t4g.medium"]
      expireAfter: 720h
  # Up to 2 extra t4g.medium (2 vCPU each) on top of the base.
  limits:
    cpu: "4"
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 5m

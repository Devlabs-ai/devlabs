# Phase-0 spike for the Linux module: a learner machine running systemd as PID 1 with
# root/sudo inside, on the labs-linux pool, without host privileges. Container root is an
# unprivileged node UID (user namespace) with namespaced capabilities only; the
# nri-cgroup-rw plugin makes the cgroupfs writable so systemd can boot, and the
# devlabs/linux-box.json seccomp profile (seccomp-profiles.yaml) blocks risky syscalls.
#
# Driven by ./deploy/eks/eks-linux.sh spike (applies, waits, runs the capability checks).
apiVersion: v1
kind: Namespace
metadata:
  name: dl-linux-spike
---
apiVersion: v1
kind: Pod
metadata:
  name: box-userns
  namespace: dl-linux-spike
  labels: {app: linux-box}
  annotations:
    karpenter.sh/do-not-disrupt: "true"
    devlabs.io/cgroup-rw: "true"
spec:
  hostUsers: false
  hostname: order-box
  automountServiceAccountToken: false
  enableServiceLinks: false
  terminationGracePeriodSeconds: 10
  nodeSelector:
    devlabs.io/pool: linux
  tolerations:
    - key: devlabs.io/pool
      value: linux
      effect: NoSchedule
  containers:
    - name: box
      image: devsetu/linux-lab:v0.5
      imagePullPolicy: Always
      securityContext:
        capabilities:
          add: [SYS_ADMIN, NET_ADMIN, NET_RAW, SYS_PTRACE, SYS_RESOURCE, SYS_NICE, AUDIT_WRITE]
        seccompProfile:
          type: Localhost
          localhostProfile: devlabs/linux-box.json
      resources:
        requests: {cpu: 250m, memory: 384Mi}
        limits: {cpu: "1", memory: 1Gi}
      volumeMounts:
        - {name: run, mountPath: /run}
        - {name: run-lock, mountPath: /run/lock}
        - {name: tmp, mountPath: /tmp}
  volumes:
    - name: run
      emptyDir: {medium: Memory, sizeLimit: 64Mi}
    - name: run-lock
      emptyDir: {medium: Memory, sizeLimit: 8Mi}
    - name: tmp
      emptyDir: {sizeLimit: 1Gi}

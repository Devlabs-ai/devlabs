apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: order-archive-snap
spec:
  volumeSnapshotClassName: quickbyte-snapclass
  source:
    persistentVolumeClaimName: order-archive-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-archive-pvc-restore
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  dataSource:
    name: order-archive-snap
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
---
apiVersion: v1
kind: Pod
metadata:
  name: archive-restore-check
spec:
  containers:
    - name: check
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: restore
          mountPath: /restore
  volumes:
    - name: restore
      persistentVolumeClaim:
        claimName: order-archive-pvc-restore

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-cache-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # From SC annotation quickbyte.ai/size-hint
      storage: REPLACE_WITH_SIZE_HINT
  # From: kubectl get sc — name ending with -$LEARNER_NS
  storageClassName: REPLACE_WITH_DISCOVERED_SC_NAME
---
apiVersion: v1
kind: Pod
metadata:
  name: cache-writer
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: cache
          # From SC annotation quickbyte.ai/mount-path
          mountPath: REPLACE_WITH_MOUNT_PATH
  volumes:
    - name: cache
      persistentVolumeClaim:
        claimName: order-cache-pvc

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-cache-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: quickbyte-fast
---
apiVersion: v1
kind: Pod
metadata:
  name: cache-writer
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts:
        - name: cache
          mountPath: /cache
  volumes:
    - name: cache
      persistentVolumeClaim:
        claimName: order-cache-pvc

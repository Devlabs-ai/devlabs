apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-processor-deploy
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: order-processor
  template:
    metadata:
      labels:
        app: order-processor
    spec:
      containers:
        - name: order-processor
          image: devsetu/order-processor:v1.2
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "40m"
              memory: "64Mi"

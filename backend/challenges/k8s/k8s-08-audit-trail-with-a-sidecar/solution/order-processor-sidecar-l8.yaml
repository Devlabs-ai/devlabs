apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-processor-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-processor
      tier: app
  template:
    metadata:
      labels:
        app: order-processor
        tier: app
    spec:
      volumes:
        - name: order-logs
          emptyDir: {}
      containers:
        - name: order-processor
          image: rithvikreddyalkanti/order-processor:v1.2
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "50m"
              memory: "128Mi"
          volumeMounts:
            - name: order-logs
              mountPath: /var/log/orders
        - name: log-shipper
          image: busybox:1.36
          command: ["/bin/sh", "-c", "tail -F /var/log/orders/orders.log 2>/dev/null || sleep 3600"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
          volumeMounts:
            - name: order-logs
              mountPath: /var/log/orders

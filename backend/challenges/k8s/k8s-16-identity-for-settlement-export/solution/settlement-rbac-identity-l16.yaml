apiVersion: v1
kind: ServiceAccount
metadata:
  name: settlement-exporter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: settlement-exporter-pod-reader
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: settlement-exporter-pod-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: settlement-exporter-pod-reader
subjects:
  - kind: ServiceAccount
    name: settlement-exporter

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: shop
    ports:
      - "${HOST_PORT_POSTGRES}:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=50", "-c", "effective_cache_size=64MB", "-c", "work_mem=2MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d shop"]
      interval: 3s
      timeout: 3s
      retries: 30

  orders-service:
    build:
      context: ./services/orders-service
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: appuser
      PGPASSWORD: apppass
      PGDATABASE: shop
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HOST_PORT_ORDERS_SERVICE}:8080"
    restart: unless-stopped

  load-generator:
    build:
      context: ./services/load-generator
    environment:
      TARGET_URL: http://orders-service:8080
      USERS: "200"
      SLEEP_SECONDS: "1.0"
    depends_on:
      orders-service:
        condition: service_started
    restart: unless-stopped

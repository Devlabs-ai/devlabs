version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    volumes:
      - ./init/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${HOST_PORT_POSTGRES}:5432"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - catalog-net

  redis:
    image: redis:7-alpine
    ports:
      - "${HOST_PORT_REDIS}:6379"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - catalog-net

  product-catalog-service:
    build:
      context: ./services/product-catalog-service
    environment:
      FLASK_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      POSTGRES_DB: catalog
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports:
      - "${HOST_PORT_PRODUCT_CATALOG_SERVICE}:5000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - catalog-net

  load-generator:
    build:
      context: ./services/load-generator
    environment:
      TARGET_HOST: product-catalog-service
      TARGET_PORT: "5000"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    depends_on:
      - product-catalog-service
    networks:
      - catalog-net

networks:
  catalog-net:
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./init:/docker-entrypoint-initdb.d
    ports:
      - "${HOST_PORT_POSTGRES}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 15
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    labels:
      devlabs.role: infra

  airflow:
    image: apache/airflow:2.9.3
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "10"
      AIRFLOW__WEBSERVER__SECRET_KEY: devlabs-secret-key-fixed
      AIRFLOW__CORE__FERNET_KEY: ""
    volumes:
      - ./services/airflow/dags:/opt/airflow/dags
      - ./services/airflow/entrypoint.sh:/entrypoint_custom.sh
    entrypoint: ["/bin/bash", "/entrypoint_custom.sh"]
    ports:
      - "${HOST_PORT_AIRFLOW}:8080"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    labels:
      devlabs.role: infra

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./init/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${HOST_PORT_POSTGRES}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    labels:
      devlabs.role: infra

  products-service:
    build:
      context: ./services/products-service
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: shop
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "${HOST_PORT_PRODUCTS}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    labels:
      devlabs.role: worker

  orders-service:
    build:
      context: ./services/orders-service
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: shop
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "${HOST_PORT_ORDERS}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    labels:
      devlabs.role: worker

  dashboard:
    build:
      context: ./services/dashboard
    restart: always
    environment:
      API_BASE_URL: http://wrong-host:9999
    ports:
      - "${HOST_PORT_DASHBOARD}:8080"
    depends_on:
      - products-service
      - orders-service
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    labels:
      devlabs.role: worker

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./services/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "${HOST_PORT_NGINX}:80"
    depends_on:
      - products-service
      - orders-service
      - dashboard
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    labels:
      devlabs.role: infra

# infra/terraform/prod: plan on pull requests (read-only role), apply on merge to main
# (environment "infra", which requires an approval). bootstrap/ is applied by hand once.
# See docs/cicd-and-aws-access.md.

name: Terraform

on:
  pull_request:
    paths:
      - infra/terraform/**
      - .github/workflows/terraform.yml
  push:
    branches: [main]
    paths:
      - infra/terraform/**
      - .github/workflows/terraform.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-2
  AWS_ACCOUNT_ID: "204098850303"
  TF_VERSION: 1.16.5
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra/terraform
      - name: validate
        run: |
          for dir in infra/terraform/bootstrap infra/terraform/prod; do
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
          done

  plan:
    needs: validate
    # Fork PRs get no OIDC token; skip instead of failing.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/devlabs-gha-terraform-plan
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init
      - name: plan
        run: |
          terraform plan -no-color -lock-timeout=5m -out=tfplan
          {
            echo '### terraform plan (prod)'
            echo '```'
            terraform show -no-color tfplan | tail -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: infra
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/terraform/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/devlabs-gha-terraform-apply
          aws-region: ${{ env.AWS_REGION }}
      - run: terraform init
      - run: terraform plan -no-color -lock-timeout=5m -out=tfplan
      - run: terraform apply -no-color -lock-timeout=5m tfplan

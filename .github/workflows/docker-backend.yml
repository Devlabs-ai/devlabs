# Build the production backend image and push to Docker Hub.
# Repository: https://hub.docker.com/r/rithvikreddyalkanti/devlabs-backend (public)
#
# Required GitHub repo secrets:
#   DOCKERHUB_USERNAME  — e.g. rithvikreddyalkanti
#   DOCKERHUB_TOKEN   — Docker Hub access token (read/write)

name: Backend image

on:
  push:
    branches: [main, ft/deploy]
    paths:
      - 'backend/**'
      - 'deploy/Dockerfile.backend'
      - '.github/workflows/docker-backend.yml'
  workflow_dispatch:

env:
  IMAGE: rithvikreddyalkanti/devlabs-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
